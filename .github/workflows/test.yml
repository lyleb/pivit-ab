name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pivit
          POSTGRES_PASSWORD: pivit
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pivit -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pivit:pivit@localhost:5432/postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Postgres client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      # Same path as process startup. Version 000 is schema.sql. Later versions
      # run once, in order. pivit_ci exists only on this runner and is discarded
      # with it. The URL is a throwaway login for the service container, not a secret.
      - name: Apply schema and numbered migrations
        env:
          DATABASE_URL: postgres://pivit:pivit@localhost:5432/pivit_ci
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE pivit_ci"
          npm run migrate
          applied=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "SELECT version FROM schema_migrations ORDER BY version")
          expected=$(node -e "const { VERSIONS } = require('./src/db/migrate'); console.log(VERSIONS.map((step) => step.version).join('\n'))")
          if [ "$applied" != "$expected" ]; then
            echo "Startup recorded these versions:"
            printf '%s\n' "$applied"
            echo "The app applies these versions at boot:"
            printf '%s\n' "$expected"
            exit 1
          fi
          echo "Applied schema.sql and every numbered migration, in boot order."
      - run: npm test
