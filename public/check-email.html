<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://pivitlab.com/check-email.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/pivitlab-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>pivitlab — Check your email</title>
<link rel="stylesheet" href="/assets/pivit.css?v=5">
</head>
<body class="auth-page">
<div class="card auth-card">
  <div class="brand">
    <span class="brand-logo" role="img" aria-label="pivitlab"></span>
    <h1>Check your email</h1>
    <p class="hint" id="sent-to">We've sent a sign-in link. It expires in 15 minutes.</p>
  </div>
  <form id="code-form">
    <label for="code">6-digit code</label>
    <input id="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
    <button id="code-btn" type="submit">Sign in</button>
  </form>
  <p id="code-error" class="error-msg" style="text-align:center;margin-top:12px;"></p>
  <button type="button" class="btn-ghost" id="resend" style="width:100%;margin-top:8px;" disabled>Resend in 60s</button>
  <p class="hint" style="text-align:center;margin-top:16px;">The link in the email opens a page with a Sign in button. You can use that instead of the code.</p>
</div>
<script>
const params = new URLSearchParams(location.search);
const email = (params.get('email') || '').trim();
const purpose = params.get('purpose') === 'signup' ? 'signup' : 'signin';
const sent = document.getElementById('sent-to');
if (email) sent.textContent = `We've sent a link to ${email}. It expires in 15 minutes.`;

const resendBtn = document.getElementById('resend');
let left = 60;
const timer = setInterval(() => {
  left -= 1;
  if (left <= 0) {
    clearInterval(timer);
    resendBtn.disabled = false;
    resendBtn.textContent = 'Resend email';
    return;
  }
  resendBtn.textContent = `Resend in ${left}s`;
}, 1000);

document.getElementById('code-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const btn = document.getElementById('code-btn');
  const errorEl = document.getElementById('code-error');
  errorEl.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code: document.getElementById('code').value.trim() }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      errorEl.textContent = data.error || 'That code is not valid, or it has expired.';
      btn.disabled = false;
      return;
    }
    location.href = '/index.html';
  } catch (err) {
    errorEl.textContent = "Couldn't reach pivitlab. Check your connection and try again.";
    btn.disabled = false;
  }
});

resendBtn.addEventListener('click', async () => {
  resendBtn.disabled = true;
  const errorEl = document.getElementById('code-error');
  errorEl.textContent = '';
  let path = '/api/auth/email';
  let body = { email };
  if (purpose === 'signup') {
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('pivit-signup') || 'null'); } catch (err) { saved = null; }
    if (saved && saved.email) {
      path = '/api/auth/signup';
      body = saved;
    }
  }
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      errorEl.textContent = data.error || 'Please wait a while before asking for another link.';
      resendBtn.disabled = false;
      return;
    }
    errorEl.className = 'ok-msg';
    errorEl.style.textAlign = 'center';
    errorEl.textContent = "If that address can be used, we've sent a link.";
    resendBtn.textContent = 'Sent';
  } catch (err) {
    errorEl.textContent = "Couldn't reach pivitlab. Check your connection and try again.";
    resendBtn.disabled = false;
  }
});
</script>
</body>
</html>
