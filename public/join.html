<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://pivitlab.com/join.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/pivitlab-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>pivitlab — Join an agency</title>
<link rel="stylesheet" href="/assets/pivit.css?v=5">
</head>
<body class="auth-page">
<div class="card auth-card">
  <div class="brand">
    <span class="brand-logo" role="img" aria-label="pivitlab"></span>
    <h1>Join this agency</h1>
    <p class="hint">This link works once. Opening it does not use it up.</p>
  </div>
  <p id="join-detail" class="hint"></p>
  <form id="join-form">
    <button id="join-btn" type="submit">Join this agency</button>
  </form>
  <p class="hint legal-note">By joining you agree to the <a href="/legal.html">terms and privacy notice</a>.</p>
  <p id="join-error" class="error-msg" style="text-align:center;margin-top:12px;"></p>
  <p class="hint" style="text-align:center;margin-top:16px;"><a href="/login.html">Already use pivitlab? Sign in</a></p>
</div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
const errorEl = document.getElementById('join-error');
const detailEl = document.getElementById('join-detail');
const btn = document.getElementById('join-btn');

function roleWord(role) {
  if (role === 'owner') return 'Owner';
  if (role === 'member') return 'Member';
  return '';
}

if (!token) {
  btn.disabled = true;
  errorEl.textContent = 'This page needs the link from your invite.';
} else {
  btn.disabled = true;
  fetch('/api/auth/join?token=' + encodeURIComponent(token), { cache: 'no-store' })
    .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
    .then((result) => {
      if (!result.ok) {
        errorEl.textContent = (result.data && result.data.error) || "That invite isn't valid. It may have expired, or it may already have been used.";
        return;
      }
      const role = roleWord(result.data.role);
      const agency = result.data.agency_name || 'this agency';
      const email = result.data.email || '';
      const article = result.data.role === 'owner' ? 'an' : 'a';
      detailEl.textContent = role
        ? 'You are joining ' + agency + ' as ' + article + ' ' + role + '. This invite is for ' + email + '.'
        : 'You are joining ' + agency + '. This invite is for ' + email + '.';
      btn.disabled = false;
    })
    .catch(() => {
      errorEl.textContent = 'Please try again.';
    });
}

document.getElementById('join-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!token || btn.disabled) return;
  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Joining…';
  try {
    const res = await fetch('/api/auth/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      errorEl.textContent = data.error || "That invite isn't valid. It may have expired, or it may already have been used.";
      btn.disabled = false;
      btn.textContent = 'Join this agency';
      return;
    }
    window.location.href = '/index.html';
  } catch (err) {
    errorEl.textContent = 'Please try again.';
    btn.disabled = false;
    btn.textContent = 'Join this agency';
  }
});
</script>
</body>
</html>
