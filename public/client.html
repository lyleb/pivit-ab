<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/pivitlab-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>pivitlab — Results</title>
<link rel="stylesheet" href="/assets/pivit.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/admin-ui.js"></script>
<style>
  .portal-top {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--sidebar); border-bottom: 1px solid var(--border);
    padding: calc(12px + env(safe-area-inset-top)) 20px 12px;
  }
  .portal-top .brand-logo { height: 36px; }
  .portal-top-actions { display: flex; align-items: center; gap: 12px; }
  .welcome { font-size: 0.85em; color: var(--text-muted); }
  .portal-wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 48px; }
  .portal-grid {
    display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; align-items: start;
  }
  .portal-grid > .card { margin-top: 0; }
  .url-group { margin-top: 16px; }
  .url-group:first-child { margin-top: 4px; }
  .url-group-label { display: block; margin: 0 0 6px; }
  button.exp-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    width: 100%; min-height: var(--tap); margin-top: 8px; padding: 10px 12px; text-align: left;
    background: var(--card-2); color: var(--ink); border: 1px solid var(--border); border-radius: 8px;
    font-weight: 650;
  }
  button.exp-row:hover { background: #222633; }
  button.exp-row.selected { border-color: var(--indigo); background: rgba(86,53,251,0.16); }
  button.exp-row .exp-name { overflow-wrap: anywhere; }
  .results-meta { margin: -4px 0 14px; }
  .trend-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .portal-foot { margin: 22px 0 0; }
  .plan-sentence { font-size: 1.05em; font-weight: 750; margin: 8px 0; }
  .progress-track { height: 8px; background: #262a38; border-radius: 99px; overflow: hidden; margin: 6px 0 14px; }
  .progress-bar { height: 100%; background: var(--indigo); }
  .verdict-card { border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 12px 0; background: var(--card-2); }
  .verdict-card.win { border-color: #1d6b52; }
  .verdict-card.loss { border-color: #8a3a3a; }
  .verdict-card.inconclusive, .verdict-card.data_problem { border-color: #8a6a2f; }
  .verdict-card h3 { margin: 4px 0 8px; font-size: 1.35em; }
  .peek-banner { border: 1px solid #8a6a2f; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; }
  @media (max-width: 860px) {
    .portal-grid { grid-template-columns: minmax(0, 1fr); }
    .portal-top .welcome { display: none; }
    .portal-top .brand-logo { height: 28px; }
    .portal-wrap { padding: 16px 16px 40px; }
  }
</style>
</head>
<body>
<header class="portal-top">
  <span class="brand-logo" role="img" aria-label="pivitlab"></span>
  <div class="portal-top-actions">
    <span class="welcome" id="welcome-msg"></span>
    <button type="button" class="btn-ghost" id="logout-btn">Log out</button>
  </div>
</header>

<div class="portal-wrap">
  <div class="portal-grid">
    <section class="card" id="list-card">
      <h2>Your experiments</h2>
      <p id="exp-msg" class="hint">Loading…</p>
      <div id="experiments-list"></div>
    </section>

    <section class="card" id="results-section" hidden>
      <h2 id="results-title">Results</h2>
      <p id="results-meta" class="hint results-meta"></p>
      <p id="results-msg" class="hint"></p>
      <div id="plan-note"></div>
      <div id="results-live" hidden>
        <div id="bayesian-summary" class="result-summary" hidden></div>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Results by variant (scrolls sideways)">
          <table id="results-table">
            <thead><tr>
              <th>Variant</th>
              <th class="num">Visitors</th>
              <th class="num">New</th>
              <th class="num">Returning</th>
              <th class="num">Conversions</th>
              <th class="num">Rate</th>
            </tr></thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
        <p class="hint">A visitor who converts more than once still counts as one conversion.</p>
        <div id="goal-breakdown" hidden></div>
        <p class="hint table-scroll-hint">Swipe the table sideways for more columns.</p>
        <div class="chart-wrap rate-wrap" id="rate-chart-wrap"><canvas id="rate-chart"></canvas></div>
        <div class="trend-row" id="trend-toggle">
          <span class="hint">Trend:</span>
          <button type="button" class="btn-ghost trend-toggle-btn active" id="trend-mode-cumulative">Cumulative</button>
          <button type="button" class="btn-ghost trend-toggle-btn" id="trend-mode-daily">Daily</button>
        </div>
        <div class="chart-wrap trend-wrap"><canvas id="trend-chart"></canvas></div>
      </div>
    </section>
  </div>
  <p class="hint portal-foot">Questions about a result? Contact the person who set up your tests.</p>
</div>

<script>
const UI = window.PivitUI;
const STATUS_CLASS = { running: 'live', draft: 'draft', paused: 'paused', archived: 'archived' };
const STATUS_LABEL = { running: 'Running', paused: 'Paused', archived: 'Finished', draft: 'Not started' };
const LOAD_ERROR = 'Something went wrong loading your results. Please refresh, or contact the person who set up your tests.';
const DRAFT_GATE = "This test hasn't started yet. Results appear once it's running.";
const EMPTY_GATE = "This test hasn't collected visitors yet. Results appear once it's running.";

let rateChart;
let trendChart;
let currentTrendSeries = [];
let trendMode = 'cumulative';

function statusLabel(status) {
  return STATUS_LABEL[status] || status || '';
}

function formatSince(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return '';
  return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login.html';
});

async function callApi(path) {
  let res;
  try {
    res = await fetch(path);
  } catch (err) {
    console.error('Client API error', path, err);
    return { ok: false, message: "Couldn't reach pivitlab. Check your connection and try again." };
  }
  if (res.status === 401) {
    window.location.href = '/login.html';
    return { ok: false, message: 'not authenticated' };
  }
  const raw = await res.text();
  let data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch (e) {}
  if (!res.ok) {
    console.error('Client API error', path, res.status, data && data.error);
    return { ok: false, message: LOAD_ERROR };
  }
  return { ok: true, data };
}

function hideLiveResults() {
  document.getElementById('results-live').hidden = true;
  const note = document.getElementById('plan-note');
  if (note) note.innerHTML = '';
  document.getElementById('bayesian-summary').hidden = true;
  const goals = document.getElementById('goal-breakdown');
  if (goals) { goals.hidden = true; goals.innerHTML = ''; }
  document.getElementById('results-meta').textContent = '';
  if (rateChart) { rateChart.destroy(); rateChart = null; }
  if (trendChart) { trendChart.destroy(); trendChart = null; }
  currentTrendSeries = [];
  const trendCanvas = document.getElementById('trend-chart');
  if (trendCanvas) {
    trendCanvas.style.display = 'none';
    trendCanvas.parentElement.classList.remove('has-data');
  }
}

async function init() {
  const me = await callApi('/api/auth/me');
  if (!me.ok) return;
  if (me.data.role !== 'client') { window.location.href = '/login.html'; return; }
  document.getElementById('welcome-msg').textContent = `Signed in as ${me.data.client.name}`;

  const result = await callApi('/api/client/experiments');
  const msgEl = document.getElementById('exp-msg');
  if (!result.ok) { msgEl.textContent = result.message; return; }

  const experiments = result.data.experiments || [];
  if (experiments.length === 0) { msgEl.textContent = 'No experiments have been shared with you yet.'; return; }
  msgEl.textContent = '';

  const groups = {};
  experiments.forEach((exp) => {
    const key = exp.url_match || '';
    (groups[key] = groups[key] || []).push(exp);
  });

  const listEl = document.getElementById('experiments-list');
  listEl.innerHTML = '';
  Object.entries(groups).forEach(([url, exps]) => {
    const group = document.createElement('div');
    group.className = 'url-group';
    const label = url ? UI.shortUrl(url) : 'Other tests';
    group.innerHTML = `<div class="kicker url-group-label">${UI.escapeHtml(label)}</div>`;
    exps.forEach((exp) => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'exp-row';
      row.id = `exp-row-${exp.id}`;
      row.innerHTML = `<span class="exp-name">${UI.escapeHtml(exp.name)}</span> <span class="badge ${STATUS_CLASS[exp.status] || 'paused'}">${UI.escapeHtml(statusLabel(exp.status))}</span>`;
      row.addEventListener('click', () => loadResults(exp));
      group.appendChild(row);
    });
    listEl.appendChild(group);
  });
}

function boundedRate(visitors, conversions) {
  const v = Number(visitors) || 0;
  const c = Number(conversions) || 0;
  if (v <= 0 || c <= 0) return 0;
  return +(Math.min(c, v) / v * 100).toFixed(2);
}

function computeTrendDatasets(series, mode) {
  const days = [...new Set(series.map((r) => r.day))].sort();
  const variantNames = [...new Set(series.map((r) => r.variant_name))];
  const palette = ['#5635FB', '#02DEB5', '#e07a5f', '#c4b6ff', '#a3690f'];

  const datasets = variantNames.map((name, i) => {
    let cumVisitors = 0, cumConversions = 0;
    const dataByDay = days.map((day) => {
      const row = series.find((r) => r.day === day && r.variant_name === name) || {};
      if (mode === 'cumulative' && row.cumulative_visitors != null) {
        return boundedRate(row.cumulative_visitors, row.cumulative_conversions);
      }
      const v = Number(row.visitors) || 0;
      const c = Number(row.conversions) || 0;
      if (mode === 'cumulative') {
        cumVisitors += v;
        cumConversions += c;
        return boundedRate(cumVisitors, cumConversions);
      }
      return boundedRate(v, c);
    });
    return { label: name, data: dataByDay, borderColor: palette[i % palette.length], backgroundColor: palette[i % palette.length], tension: 0.2, fill: false };
  });

  return {
    labels: days.map((d) => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })),
    datasets,
  };
}

function renderTrendChart() {
  const trendCanvas = document.getElementById('trend-chart');
  document.getElementById('trend-mode-cumulative').classList.toggle('active', trendMode === 'cumulative');
  document.getElementById('trend-mode-daily').classList.toggle('active', trendMode === 'daily');

  if (trendChart) trendChart.destroy();
  if (currentTrendSeries.length === 0) {
    trendCanvas.style.display = 'none';
    trendCanvas.parentElement.classList.remove('has-data');
    return;
  }

  const { labels, datasets } = computeTrendDatasets(currentTrendSeries, trendMode);
  trendCanvas.style.display = 'block';
  trendCanvas.parentElement.classList.add('has-data');
  trendChart = new Chart(trendCanvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        title: { display: true, text: (trendMode === 'cumulative' ? 'Cumulative' : 'Daily') + ' conversion rate over time', color: '#e8e9f0' },
        legend: { labels: { color: '#e8e9f0' } },
      },
      scales: {
        x: { title: { display: true, text: 'Time (days)', color: '#e8e9f0' }, ticks: { color: '#9398ab' }, grid: { color: 'rgba(255,255,255,0.06)' } },
        y: {
          beginAtZero: true,
          title: { display: true, text: 'Conversion rate (%)', color: '#e8e9f0' },
          ticks: { callback: (v) => v + '%', color: '#9398ab' },
          grid: { color: 'rgba(255,255,255,0.06)' },
        },
      },
    },
  });
}

function renderGoalBreakdown(goals, primaryGoal) {
  const mount = document.getElementById('goal-breakdown');
  if (!mount) return;
  if (!goals || goals.length < 2) { mount.hidden = true; mount.innerHTML = ''; return; }
  const blocks = goals.map((goal) => {
    const rows = (goal.variants || []).map((item) => `<tr><td>${UI.escapeHtml(item.variant_name)}</td><td class="num">${item.conversions}</td><td class="num">${item.conversion_rate}%</td></tr>`).join('');
    const primary = goal.primary || goal.key === primaryGoal ? ' · primary' : '';
    return `<h3 style="margin:16px 0 8px;">${UI.escapeHtml(goal.label || goal.key)}${primary ? `<span class="hint">${UI.escapeHtml(primary)}</span>` : ''}</h3>
      <div class="table-scroll"><table><thead><tr><th>Variant</th><th class="num">Conversions</th><th class="num">Rate</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  mount.hidden = false;
  mount.innerHTML = `<p class="hint">Each goal counts a visitor once.${primaryGoal ? ' The main table uses the primary goal.' : ' The main table counts a visitor once if they hit any goal.'}</p>${blocks}`;
}

document.getElementById('trend-mode-cumulative').addEventListener('click', () => { trendMode = 'cumulative'; renderTrendChart(); });
document.getElementById('trend-mode-daily').addEventListener('click', () => { trendMode = 'daily'; renderTrendChart(); });

function progressWidth(value, target) {
  if (!(target > 0)) return 0;
  return Math.max(0, Math.min(100, Math.round((Number(value) || 0) / target * 100)));
}

function renderClientProgress(reading) {
  const variants = (reading && reading.variants) || [];
  const rows = variants.map((row) => {
    const width = progressWidth(row.visitors, row.target);
    const targetText = row.target ? ` of ${Number(row.target).toLocaleString('en-GB')}` : '';
    return `<div>
      <strong>${UI.escapeHtml(row.variant_name)}</strong>
      <span class="hint"> · ${Number(row.visitors || 0).toLocaleString('en-GB')}${targetText} visitors · ${row.traffic_split == null ? '' : row.traffic_split + '% of traffic'}</span>
      <div class="progress-track"><div class="progress-bar" style="width:${width}%"></div></div>
    </div>`;
  }).join('');
  const days = reading ? Number(reading.days_elapsed) || 0 : 0;
  const min = reading && reading.min_runtime_days ? Number(reading.min_runtime_days) : 0;
  const dayLine = min
    ? `<div><strong>${days} of ${min} days</strong><div class="progress-track"><div class="progress-bar" style="width:${progressWidth(days, min)}%"></div></div></div>`
    : '';
  return rows + dayLine;
}

function renderClientVerdict(verdict) {
  if (!verdict) return '';
  if (verdict.verdict === 'data_problem' || verdict.label === 'Data problem') {
    return `<section class="verdict-card data_problem"><div class="kicker">Verdict</div><h3>Data problem</h3><p>${UI.escapeHtml(verdict.summary || '')}</p></section>`;
  }
  const cards = (verdict.challengers || []).map((row) => `<section class="verdict-card ${UI.escapeHtml(row.verdict)}">
      <div class="kicker">${UI.escapeHtml(row.variant_name)} against ${UI.escapeHtml(row.control_name || 'Control')}</div>
      <h3>${UI.escapeHtml(row.label)}</h3>
      <p>Uplift ${UI.escapeHtml(row.uplift_label)} · 95% range ${UI.escapeHtml(row.ci_low_label)} to ${UI.escapeHtml(row.ci_high_label)}</p>
      <p>${UI.escapeHtml(row.rule_out || '')}</p>
    </section>`).join('');
  const secondary = (verdict.probability_best || []).map((row) => `${UI.escapeHtml(row.variant_name)} ${row.probability_best}%`).join(' · ');
  const details = secondary
    ? `<details><summary>Probability best (secondary)</summary><p class="hint">This is not the decision. The decision is the verdict above, read once the plan was reached. ${secondary}.</p></details>`
    : '';
  return cards + details;
}

async function loadResults(exp) {
  document.querySelectorAll('.exp-row').forEach((el) => el.classList.remove('selected'));
  const row = document.getElementById(`exp-row-${exp.id}`);
  if (row) row.classList.add('selected');

  const section = document.getElementById('results-section');
  section.hidden = false;
  document.getElementById('results-title').textContent = exp.name;
  const msgEl = document.getElementById('results-msg');
  hideLiveResults();
  section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  if (exp.status === 'draft') {
    msgEl.textContent = DRAFT_GATE;
    return;
  }

  msgEl.textContent = 'Loading…';
  const result = await callApi(`/api/client/results/${exp.id}`);
  if (!result.ok) {
    msgEl.textContent = result.message;
    return;
  }

  const results = result.data.results || [];
  const reading = result.data.reading || {};
  const visitors = reading.total_visitors != null
    ? Number(reading.total_visitors)
    : results.reduce((sum, item) => sum + Number(item.visitors || 0), 0);
  const note = document.getElementById('plan-note');
  const blinded = result.data.blinded || reading.mode === 'blind';

  if (blinded) {
    msgEl.textContent = '';
    const count = visitors.toLocaleString('en-GB');
    const days = Number(reading.days_elapsed) || 0;
    const min = reading.min_runtime_days ? Number(reading.min_runtime_days) : null;
    const dayText = min ? ` · ${days} of ${min} days` : '';
    document.getElementById('results-meta').textContent = `${count} visitors${dayText}`;
    const sentence = reading.plan && reading.plan.sentence ? reading.plan.sentence : '';
    note.innerHTML = `<p class="plan-sentence">${UI.escapeHtml(sentence)}</p>
      <p>Results stay hidden until the plan is reached.</p>
      ${renderClientProgress(reading)}`;
    return;
  }

  if (UI.resultsGated(exp.status, visitors)) {
    msgEl.textContent = exp.status === 'draft' ? DRAFT_GATE : EMPTY_GATE;
    return;
  }

  msgEl.textContent = '';
  const since = formatSince(exp.created_at);
  const count = visitors.toLocaleString('en-GB');
  const meta = document.getElementById('results-meta');
  if (exp.status === 'running' && since) meta.textContent = `Running since ${since} · ${count} visitors`;
  else if (since) meta.textContent = `${statusLabel(exp.status)} · since ${since} · ${count} visitors`;
  else meta.textContent = `${count} visitors`;

  if (reading.mode === 'data_problem' || reading.mode === 'verdict') {
    const peeked = reading.peeked ? '<div class="peek-banner"><strong>Peeked.</strong> Someone looked before the plan was reached. The verdict still uses the planned sample.</div>' : '';
    note.innerHTML = peeked + renderClientVerdict(result.data.verdict);
  } else if (reading.mode === 'peeked') {
    note.innerHTML = '<div class="peek-banner"><strong>Peeked.</strong> Someone looked before the plan was reached. This is not the verdict.</div>';
  } else if (reading.mode === 'unplanned') {
    note.innerHTML = '<p>This test has no plan yet, so these figures are a live look, not a verdict.</p>';
  } else {
    note.innerHTML = '';
  }

  document.getElementById('results-live').hidden = false;
  renderGoalBreakdown(result.data.goals, result.data.primary_goal);
  const tbody = document.getElementById('results-body');
  tbody.innerHTML = results.map((item) => `<tr>
    <td>${UI.escapeHtml(item.variant_name)}</td>
    <td class="num">${item.visitors}</td>
    <td class="num">${item.new_visitors}</td>
    <td class="num">${item.returning_visitors}</td>
    <td class="num">${item.conversions}</td>
    <td class="num">${item.conversion_rate}%</td>
  </tr>`).join('');

  const rateWrap = document.getElementById('rate-chart-wrap');
  const rateCanvas = document.getElementById('rate-chart');
  rateWrap.hidden = !results.length;
  if (results.length && window.Chart) {
    rateChart = new Chart(rateCanvas, {
      type: 'bar',
      data: {
        labels: results.map((item) => item.variant_name),
        datasets: [{ label: 'Conversion rate (%)', data: results.map((item) => item.conversion_rate), backgroundColor: '#5635FB' }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { title: { display: true, text: 'Conversion rate by variant', color: '#e8e9f0' }, legend: { labels: { color: '#e8e9f0' } } },
        scales: {
          x: { ticks: { color: '#9398ab' }, grid: { color: 'rgba(255,255,255,0.06)' } },
          y: { beginAtZero: true, ticks: { color: '#9398ab' }, grid: { color: 'rgba(255,255,255,0.06)' } },
        },
      },
    });
  }

  const trendResult = await callApi(`/api/client/results/${exp.id}/timeseries`);
  currentTrendSeries = (trendResult.ok && trendResult.data.series) ? trendResult.data.series : [];
  renderTrendChart();

  const summaryEl = document.getElementById('bayesian-summary');
  if (reading.mode === 'verdict' || reading.mode === 'data_problem' || reading.mode === 'peeked' || reading.mode === 'unplanned') {
    summaryEl.hidden = true;
    return;
  }
  const bayesianResult = await callApi(`/api/client/results/${exp.id}/bayesian`);
  if (!bayesianResult.ok || !bayesianResult.data.secondary || !bayesianResult.data.stats || bayesianResult.data.stats.length < 2) {
    summaryEl.hidden = true;
  } else {
    const stats = bayesianResult.data.stats;
    const line = stats.map((item) => `${item.variant_name} ${item.probability_best}%`).join(', ');
    summaryEl.hidden = false;
    summaryEl.textContent = `Probability best, as a secondary detail only: ${line}. The decision is the verdict above.`;
  }
}

if (window.Chart) {
  Chart.defaults.color = '#c5c8d4';
  Chart.defaults.borderColor = 'rgba(255,255,255,0.08)';
}

init();
</script>
</body>
</html>
