<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/pivitlab-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>pivitlab — Log in</title>
<link rel="stylesheet" href="/assets/pivit.css?v=3">
<style>
  body.login-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  .login-card { width: 360px; max-width: 100%; padding: 36px 32px; }
  .login-card .brand { text-align: center; }
  .login-card .brand-logo { height: 56px; display: block; margin: 0 auto 18px; }
  .login-card label { margin: 0 0 6px; }
  .login-card input { margin-bottom: 14px; }
  .login-card form button { width: 100%; margin-top: 4px; }
  .login-card .error-msg { margin-top: 14px; min-height: 1.2em; font-weight: 600; }
  .mode-label {
    display: inline-block; margin: 0 auto 18px; padding: 3px 10px; border-radius: 999px;
    background: rgba(86,53,251,0.16); color: #c4b6ff; font-size: 0.75em; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  button.mode-switch {
    display: block; width: 100%; text-align: center; margin-top: 18px; padding: 8px 0;
    background: none; color: var(--text-muted); border: none; cursor: pointer;
    font-weight: 600; font-size: 0.85em; text-decoration: underline; min-height: 44px;
  }
  button.mode-switch:hover { background: none; color: var(--indigo); }
  .forgot-link {
    display: block; text-align: center; margin-top: 14px; font-size: 0.82em;
    color: var(--text-muted); cursor: pointer; text-decoration: underline;
  }
  .forgot-link:hover { color: var(--indigo); }
  .forgot-note {
    display: none; background: rgba(86,53,251,0.12); border: 1px solid rgba(86,53,251,0.45);
    border-radius: 8px; padding: 12px 14px; font-size: 0.85em; margin-top: 12px; line-height: 1.5;
  }
  #client-form { display: none; }
  @media (max-width: 640px) {
    .login-card { width: 100%; padding: 28px 20px; }
  }
</style>
</head>
<body class="login-page">
<div class="card login-card">
  <div class="brand">
    <span class="brand-logo" role="img" aria-label="pivitlab" id="login-logo"></span>
    <div class="mode-label" id="mode-label">Owner</div>
  </div>

  <form id="owner-form">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password" autofocus required>
    <button id="owner-btn" type="submit">Log in</button>
    <a class="forgot-link" onclick="toggleForgotNote('owner-forgot-note')">Forgot password?</a>
    <div id="owner-forgot-note" class="forgot-note">The owner password is managed in your hosting settings. There's no in-app reset for it.</div>
  </form>

  <form id="client-form">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Your username" required>
    <label for="client-password">Password</label>
    <input id="client-password" type="password" placeholder="Enter your password" required>
    <button id="client-btn" type="submit">Log in</button>
    <a class="forgot-link" onclick="toggleForgotNote('client-forgot-note')">Forgot password?</a>
    <div id="client-forgot-note" class="forgot-note">Contact the person who gave you access — they can reset your password for you from their dashboard.</div>
  </form>

  <p id="login-error" class="error-msg"></p>
  <button type="button" class="mode-switch" id="toggle-link">Client login</button>
</div>

<script>
let mode = 'owner';

function applyMode(next, updateUrl) {
  mode = next === 'client' ? 'client' : 'owner';
  document.getElementById('owner-form').style.display = mode === 'owner' ? 'block' : 'none';
  document.getElementById('client-form').style.display = mode === 'client' ? 'block' : 'none';
  document.getElementById('mode-label').textContent = mode === 'owner' ? 'Owner' : 'Client';
  document.getElementById('toggle-link').textContent = mode === 'owner' ? 'Client login' : 'Owner login';
  document.getElementById('login-logo').style.display = 'block';
  document.getElementById('login-error').textContent = '';
  // Collapse both "forgot password" notes whenever the form switches, so a
  // note left open on one side doesn't linger after switching to the other.
  document.getElementById('owner-forgot-note').style.display = 'none';
  document.getElementById('client-forgot-note').style.display = 'none';
  if (updateUrl) {
    const url = new URL(location.href);
    if (mode === 'client') url.searchParams.set('role', 'client');
    else url.searchParams.delete('role');
    history.replaceState(null, '', url);
  }
}

function toggleForm() {
  applyMode(mode === 'owner' ? 'client' : 'owner', true);
}

function toggleForgotNote(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

async function submitLogin(path, body, btn) {
  const errorEl = document.getElementById('login-error');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Logging in…';
  errorEl.textContent = '';

  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      window.location.href = data.role === 'client' ? '/client.html' : '/index.html';
      return;
    }
    errorEl.textContent = data.error || `Login failed (${res.status})`;
  } catch (err) {
    console.error('Login request failed', err);
    errorEl.textContent = "Couldn't reach pivitlab. Check your connection and try again.";
  }

  btn.disabled = false;
  btn.textContent = originalText;
}

document.getElementById('owner-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const btn = document.getElementById('owner-btn');
  submitLogin('/api/auth/login', { password: document.getElementById('password').value }, btn);
});

document.getElementById('client-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const btn = document.getElementById('client-btn');
  submitLogin('/api/auth/client-login', {
    username: document.getElementById('username').value,
    password: document.getElementById('client-password').value,
  }, btn);
});

document.getElementById('toggle-link').addEventListener('click', toggleForm);
applyMode(new URLSearchParams(location.search).get('role') === 'client' ? 'client' : 'owner', false);
</script>
</body>
</html>
